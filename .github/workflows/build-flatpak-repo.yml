
name: Build and Deploy Flatpak Repository

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Update and publish Flatpak repository
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install required tools
        run: |
          set -eu
          if ! command -v curl >/dev/null 2>&1; then
            echo "::error::curl is required in the build container"
            exit 1
          fi
          if ! command -v jq >/dev/null 2>&1; then
            echo "::error::jq is required in the build container"
            exit 1
          fi

      - name: Configure Flatpak
        run: |
          set -eu

          flatpak remote-add --if-not-exists \
            flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Download latest upstream Flatpak bundles
        id: upstream
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          API_URL="https://api.github.com/repos/storytold/craft-launcher/releases/latest"

          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API_URL" \
            -o /tmp/release.json

          TAG="$(jq -er '.tag_name' /tmp/release.json)"
          echo "Upstream release: $TAG"

          mkdir -p downloads
          ostree init --repo=repo --mode=archive-z2

          # Download the x86_64 bundle.
          for ARCH in x86_64 aarch64; do
            URL="$(jq -r --arg arch "$ARCH" '
              [.assets[]
               | select(.name
                 | test("^artcraft-launcher-.*-linux-" + $arch + "\\.flatpak$"))]
              | sort_by(.name)
              | last
              | .browser_download_url // empty
            ' /tmp/release.json)"

            if [ -z "$URL" ]; then
              if [ "$ARCH" = "x86_64" ]; then
                echo "::error::No x86_64 Flatpak bundle found in release $TAG"
                exit 1
              fi

              echo "No aarch64 bundle in this release; skipping it."
              continue
            fi

            FILE="downloads/$(basename "$URL")"
            echo "Downloading $FILE"
            curl -fL --retry 3 "$URL" -o "$FILE"

            test -s "$FILE"
            flatpak build-import-bundle repo "$FILE"
          done

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Verify imported application
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking imported Flatpak refs..."

          ostree refs --repo=repo | tee /tmp/flatpak-refs.txt

          if ! grep -Fxq \
            "app/ai.storyteller.artcraft-launcher/x86_64/stable" \
            /tmp/flatpak-refs.txt; then
            echo "::error::Expected x86_64 application ref not found"
            exit 1
          fi

          echo "Application ref found successfully."

      - name: Import repository signing key
        id: signing
        shell: bash
        env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${FLATPAK_GPG_PRIVATE_KEY:-}" ]; then
            echo "::error::Set the FLATPAK_GPG_PRIVATE_KEY repository secret"
            exit 1
          fi

          export GNUPGHOME="$RUNNER_TEMP/flatpak-gnupg"
          mkdir -m 700 -p "$GNUPGHOME"

          printf '%s\n' "$FLATPAK_GPG_PRIVATE_KEY" \
            | gpg --batch --import

          KEY_ID="$(gpg --batch --with-colons \
            --list-secret-keys \
            | awk -F: '$1 == "sec" { print $5; exit }')"

          if [ -z "$KEY_ID" ]; then
            echo "::error::No secret signing key was imported"
            exit 1
          fi

          echo "key_id=$KEY_ID" >> "$GITHUB_OUTPUT"

          gpg --batch --export "$KEY_ID" \
            | base64 -w0 > /tmp/flatpak-public-key.txt

      - name: Sign repository and generate metadata
        env:
          GNUPGHOME: ${{ runner.temp }}/flatpak-gnupg
          GPG_KEY_ID: ${{ steps.signing.outputs.key_id }}
          REPOSITORY: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          UPSTREAM_TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          set -eu

          REPO_URL="https://${OWNER}.github.io/$(echo "$REPOSITORY" | cut -d/ -f2)"

          flatpak build-update-repo \
            --title="ArtCraft Launcher Personal Repo" \
            --comment="Personal repository for ArtCraft Launcher" \
            --description="Automatically updated ArtCraft Launcher Flatpak repository" \
            --homepage="https://github.com/storytold/craft-launcher" \
            --gpg-sign="$GPG_KEY_ID" \
            --generate-static-deltas \
            repo

          cat > repo/artcraft-launcher.flatpakrepo <<EOF
          [Flatpak Repo]
          Title=ArtCraft Launcher Personal Repo
          Url=${REPO_URL}
          Homepage=https://github.com/storytold/craft-launcher
          Comment=Personal Flatpak repository for ArtCraft Launcher
          Description=Automatically updated ArtCraft Launcher Flatpak repository
          GPGKey=$(cat /tmp/flatpak-public-key.txt)
          IsRuntime=false
          EOF

          printf '%s\n' "$UPSTREAM_TAG" > repo/UPSTREAM_VERSION

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: repo/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
