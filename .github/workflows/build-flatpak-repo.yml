
name: Build and Deploy Flatpak Repository

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and publish ArtCraft Launcher repository
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download latest upstream release
        id: upstream
        shell: bash
        run: |
          set -euo pipefail

          API="https://api.github.com/repos/storytold/craft-launcher/releases/latest"

          curl -fsSL "$API" -o /tmp/release.json

          TAG="$(jq -er '.tag_name' /tmp/release.json)"
          echo "Upstream release: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          mkdir -p downloads

          for ARCH in x86_64 aarch64; do
            URL="$(jq -r --arg arch "$ARCH" '
              [.assets[]
                | select(.name
                  | test("^artcraft-launcher-.*-linux-" + $arch + "\\.flatpak$"))]
              | first
              | .browser_download_url // empty
            ' /tmp/release.json)"

            if [ -z "$URL" ]; then
              if [ "$ARCH" = "x86_64" ]; then
                echo "::error::No x86_64 Flatpak bundle found in upstream release"
                exit 1
              fi

              echo "No aarch64 bundle found; skipping optional architecture."
              continue
            fi

            FILE="downloads/$(basename "$URL")"

            echo "Downloading $FILE"
            curl -fLsS --retry 3 "$URL" -o "$FILE"
            test -s "$FILE"

            echo "Downloaded $(du -h "$FILE" | cut -f1)"
          done

      - name: Initialize and import Flatpak bundles
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p repo
          ostree init --repo=repo --mode=archive-z2

          shopt -s nullglob
          BUNDLES=(downloads/*.flatpak)

          if [ "${#BUNDLES[@]}" -eq 0 ]; then
            echo "::error::No Flatpak bundles were downloaded"
            exit 1
          fi

          for FILE in "${BUNDLES[@]}"; do
            echo "Importing $FILE"
            flatpak build-import-bundle repo "$FILE"
          done

          echo "Imported refs:"
          ostree refs --repo=repo

          if ! ostree refs --repo=repo \
            | grep -Fxq "app/ai.storyteller.artcraft-launcher/x86_64/stable"; then
            echo "::error::Expected x86_64 application ref not found"
            exit 1
          fi

      - name: Import repository signing key
        id: signing
        shell: bash
        env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          export GNUPGHOME="$RUNNER_TEMP/flatpak-gnupg"
          mkdir -m 700 -p "$GNUPGHOME"

          if [ -z "${FLATPAK_GPG_PRIVATE_KEY:-}" ]; then
            echo "::error::Missing FLATPAK_GPG_PRIVATE_KEY GitHub Secret"
            exit 1
          fi

          printf '%s\n' "$FLATPAK_GPG_PRIVATE_KEY" \
            | gpg --batch --import

          KEY_ID="$(gpg --batch --with-colons \
            --list-secret-keys \
            | awk -F: '$1 == "sec" { print $5; exit }')"

          if [ -z "$KEY_ID" ]; then
            echo "::error::No GPG signing key imported"
            exit 1
          fi

          # This workflow requires a signing key with NO passphrase.
          # Do not print the private key or secret contents in logs.
          echo "Imported GPG signing key: $KEY_ID"
          echo "key_id=$KEY_ID" >> "$GITHUB_OUTPUT"

          gpg --batch --export "$KEY_ID" \
            | base64 -w0 > "$RUNNER_TEMP/flatpak-public-key.txt"

          test -s "$RUNNER_TEMP/flatpak-public-key.txt"

      - name: Sign repository and generate metadata
        shell: bash
        env:
          GNUPGHOME: ${{ runner.temp }}/flatpak-gnupg
          GPG_KEY_ID: ${{ steps.signing.outputs.key_id }}
          REPOSITORY: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          UPSTREAM_TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          set -euo pipefail

          REPO_NAME="${REPOSITORY#*/}"
          REPO_URL="https://${OWNER}.github.io/${REPO_NAME}"

          echo "Signing repository with GPG key $GPG_KEY_ID"

          flatpak build-update-repo \
            --title="ArtCraft Launcher Personal Repo" \
            --comment="Personal repository for ArtCraft Launcher" \
            --description="Automatically updated ArtCraft Launcher Flatpak repository" \
            --homepage="https://github.com/storytold/craft-launcher" \
            --gpg-sign="$GPG_KEY_ID" \
            --generate-static-deltas \
            repo

          PUBLIC_KEY="$(cat "$RUNNER_TEMP/flatpak-public-key.txt")"

          cat > repo/artcraft-launcher.flatpakrepo <<EOF
          [Flatpak Repo]
          Title=ArtCraft Launcher Personal Repo
          Url=${REPO_URL}
          Homepage=https://github.com/storytold/craft-launcher
          Comment=Personal Flatpak repository for ArtCraft Launcher
          Description=Automatically updated Flatpak repository for ArtCraft Launcher
          GPGKey=${PUBLIC_KEY}
          IsRuntime=false
          EOF

          printf '%s\n' "$UPSTREAM_TAG" > repo/UPSTREAM_VERSION

          echo "Repository contents:"
          ls -la repo

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: repo/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
