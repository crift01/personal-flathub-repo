name: Build and Deploy Flatpak Repository

on:
  schedule:
    - cron: '0 2 * * *'  # Runs daily at 2:00 AM UTC
  workflow_dispatch:       # Manual trigger from GitHub Actions UI
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add Flathub Remote
        run: |
          flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Fetch and Build Craft Launcher Flatpak
        run: |
          git clone --depth 1 https://github.com/storytold/craft-launcher.git upstream
          mkdir -p repo

          if [ -d "upstream/packaging" ]; then
            flatpak-builder --force-clean --repo=repo build-dir upstream/packaging/*.yaml || \
            flatpak-builder --force-clean --repo=repo build-dir upstream/packaging/*.json
          fi

      - name: Generate Static Deltas and Repo Summary
        run: |
          flatpak build-update-repo --generate-static-deltas repo

      - name: Generate .flatpakrepo Descriptor
        run: |
          URL="https://${{ github.repository_owner }}.github.io/personal-flathub-repo"
          cat <<EOF > repo/craft-launcher.flatpakrepo
          [Flatpak Repo]
          Title=Craft Launcher Personal Repo
          Url=${URL}
          Homepage=https://github.com/${{ github.repository }}
          Comment=Personal Flatpak repository for Craft Launcher updates
          Description=Auto-updated Flatpak repository for Craft Launcher
          GPGKey=
          IsRuntime=false
          EOF

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: repo/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
